<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUQAM HR</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i data-lucide="shield"></i>
                    <span>MUQAM HR</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span data-i18n="nav_dashboard">Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-view="time">
                    <i data-lucide="clock"></i>
                    <span data-i18n="nav_time">Time & Attendance</span>
                </a>
                <a href="#" class="nav-item" data-view="leave">
                    <i data-lucide="calendar-off"></i>
                    <span data-i18n="nav_leave">Leave</span>
                </a>
                <a href="#" class="nav-item" data-view="expenses">
                    <i data-lucide="receipt"></i>
                    <span>Expenses</span>
                </a>
                <a href="#" class="nav-item" data-view="payroll">
                    <i data-lucide="banknote"></i>
                    <span data-i18n="nav_payroll">Payroll</span>
                </a>
                <a href="#" class="nav-item" data-view="tasks">
                    <i data-lucide="check-square"></i>
                    <span data-i18n="nav_tasks">Tasks</span>
                </a>
                <a href="#" class="nav-item" data-view="performance">
                    <i data-lucide="target"></i>
                    <span data-i18n="nav_performance">Performance</span>
                </a>
                <a href="#" class="nav-item" data-view="documents">
                    <i data-lucide="file-text"></i>
                    <span data-i18n="nav_documents">Documents</span>
                </a>
                <a href="#" class="nav-item" data-view="admin">
                    <i data-lucide="shield-check"></i>
                    <span data-i18n="nav_admin">Admin Hub</span>
                </a>
                <a href="#" class="nav-item" data-view="users">
                    <i data-lucide="users"></i>
                    <span data-i18n="nav_users">User Management</span>
                </a>
                <a href="#" class="nav-item" data-view="employees">
                    <i data-lucide="briefcase"></i>
                    <span>Employees & Contracts</span>
                </a>
                <a href="#" class="nav-item" data-view="profile">
                    <i data-lucide="user"></i>
                    <span data-i18n="nav_profile">My Profile</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="topbar">
                <div class="search-container">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" placeholder="Search (Cmd/Ctrl + K)" class="search-input" data-i18n-placeholder="search_placeholder">
                </div>
                
                <div class="topbar-actions">
                    <button class="icon-btn" id="langToggle" title="Toggle Language">
                        <i data-lucide="globe"></i>
                        <span class="lang-text" id="langText">AR</span>
                    </button>
                    <button class="icon-btn" id="themeToggle" title="Toggle Theme">
                        <i data-lucide="moon" id="themeIcon"></i>
                    </button>
                    <button class="icon-btn" title="Logout" onclick="window.handleLogout()">
                        <i data-lucide="log-out"></i>
                    </button>
                    <div class="notifications-wrapper" style="position: relative;">
                        <button class="icon-btn" title="Notifications" onclick="window.toggleNotifications()">
                            <i data-lucide="bell"></i>
                            <span class="badge" id="notificationBadge" style="display: none;">0</span>
                        </button>
                        <div class="notifications-dropdown" id="notificationsDropdown" style="display: none; position: absolute; right: 0; top: 120%; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); width: 320px; max-height: 400px; overflow-y: auto; z-index: 1000; box-shadow: var(--shadow-lg);">
                            <div style="padding: 1rem; border-bottom: 1px solid var(--color-border); font-weight: 600; display: flex; justify-content: space-between; align-items: center;">
                                <span>Notifications</span>
                                <button class="btn-secondary" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="window.markAllNotificationsRead()">Mark all read</button>
                            </div>
                            <div id="notificationsList">
                                <div style="padding: 1rem; text-align: center; color: var(--color-text-secondary);">No notifications</div>
                            </div>
                        </div>
                    </div>
                    <div class="user-profile">
                        <img id="topbarAvatar" src="https://ui-avatars.com/api/?name=User&background=007AFF&color=fff" alt="User Profile" class="avatar">
                        <div class="user-info">
                            <span id="topbarName" class="user-name">User</span>
                            <span class="user-role" data-i18n="role_employee">Employee</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dynamic Views Container -->
            <div class="view-container" id="viewContainer">
                <!-- Views will be injected here by app.js -->
            </div>
        </main>
    </div>

    <!-- Supabase & JS & Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/db.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
