<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MUQAM HR</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3e62">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">

            <nav class="sidebar-nav">
                <a href="#" class="nav-item" data-view="admin">
                    <i data-lucide="shield-check"></i>
                    <span data-i18n="nav_admin">Admin Overview</span>
                </a>
                <a href="#" class="nav-item active" data-view="dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span data-i18n="nav_dashboard">Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-view="time">
                    <i data-lucide="clock"></i>
                    <span data-i18n="nav_time">Time & Attendance</span>
                </a>
                <a href="#" class="nav-item" onclick="renderView('community')">
                    <i data-lucide="globe"></i>
                    <span data-i18n="nav_community">Community</span>
                </a>
                <a href="#" class="nav-item" onclick="renderView('leave')">
                    <i data-lucide="calendar-off"></i>
                    <span data-i18n="nav_leave">Leave</span>
                </a>
                <a href="#" class="nav-item" data-view="requests">
                    <i data-lucide="inbox"></i>
                    <span>All Requests</span>
                </a>
                <a href="#" class="nav-item" data-view="archived">
                    <i data-lucide="archive"></i>
                    <span>Archived Requests</span>
                </a>
                <a href="#" class="nav-item" data-view="expenses">
                    <i data-lucide="receipt"></i>
                    <span>Expenses</span>
                </a>
                <a href="#" class="nav-item" data-view="payroll">
                    <i data-lucide="banknote"></i>
                    <span data-i18n="nav_payroll">Payroll</span>
                </a>
                <a href="#" class="nav-item" data-view="tasks">
                    <i data-lucide="list-todo"></i>
                    <span data-i18n="nav_tasks">Tasks</span>
                </a>
                <a href="#" class="nav-item" data-view="performance">
                    <i data-lucide="target"></i>
                    <span data-i18n="nav_performance">Performance</span>
                </a>
                <a href="#" class="nav-item" data-view="documents">
                    <i data-lucide="file-text"></i>
                    <span data-i18n="nav_documents">Documents</span>
                </a>

                <a href="#" class="nav-item" data-view="users">
                    <i data-lucide="user-cog"></i>
                    <span data-i18n="nav_users">User Management</span>
                </a>
                <a href="#" class="nav-item" data-view="employees">
                    <i data-lucide="briefcase"></i>
                    <span>Employees & Contracts</span>
                </a>

            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="topbar" style="position: relative; z-index: 9999;">
                <div class="header-logo" style="display: flex; align-items: center; gap: 0.5rem;">
                    <button id="globalBackButton" class="btn btn-icon" onclick="window.goBack()" style="display: none; background: transparent; border: none; cursor: pointer; color: var(--color-text); padding: 0.5rem; border-radius: 50%;">
                        <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
                    </button>
                    <img src="/images/logo.png" alt="MUQAM HR Logo" class="app-logo">
                </div>
                
                <div class="topbar-actions">
                    <div class="search-container">
                        <i data-lucide="search" class="search-icon"></i>
                        <input type="text" autocomplete="off" placeholder="Search (Cmd/Ctrl + K)" class="search-input" data-i18n-placeholder="search_placeholder">
                    </div>
                    <div class="profile-dropdown-wrapper" style="position: relative;">
                        <div class="user-profile" onclick="window.toggleProfileDropdown()" style="cursor: pointer;">
                            <div style="position: relative;">
                                <img src="" alt="Profile" class="avatar" id="topbarAvatar" style="object-fit: cover;">
                            </div>
                            <div class="user-info">
                                <span class="user-name" id="topbarName">User</span>
                                <span class="user-role" id="topbarRole">Role</span>
                            </div>
                            <i data-lucide="chevron-down" style="width: 16px; height: 16px; margin-left: 0.5rem; color: var(--color-text-secondary);"></i>
                        </div>
                        
                        <div class="profile-dropdown-menu" id="profileDropdown" style="display: none;">
                            <a href="#" class="dropdown-item" onclick="renderView('profile'); window.toggleProfileDropdown(); return false;" style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; color: var(--color-text); text-decoration: none; border-bottom: 1px solid var(--color-border);">
                                <i data-lucide="user" style="width: 18px; height: 18px;"></i>
                                <span data-i18n="nav_profile">My Profile</span>
                            </a>
                            <a href="#" class="dropdown-item" onclick="renderView('messages'); window.toggleProfileDropdown(); return false;" style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; color: var(--color-text); text-decoration: none; border-bottom: 1px solid var(--color-border);">
                                <i data-lucide="message-square" style="width: 18px; height: 18px;"></i>
                                <span data-i18n="nav_messages">Messages</span>
                            </a>

                            <a href="#" class="dropdown-item" onclick="window.toggleLanguage(); return false;" style="display: flex; align-items: center; justify-content: space-between; padding: 1rem; color: var(--color-text); text-decoration: none; border-bottom: 1px solid var(--color-border);">
                                <div style="display: flex; align-items: center; gap: 0.75rem;">
                                    <i data-lucide="globe" style="width: 18px; height: 18px;"></i>
                                    <span data-i18n="nav_language">Language: </span> <strong id="currentLangDisplay">EN</strong>
                                </div>
                            </a>
                            <a href="#" class="dropdown-item" onclick="window.toggleTheme(); return false;" style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; color: var(--color-text); text-decoration: none; border-bottom: 1px solid var(--color-border);">
                                <i data-lucide="moon" style="width: 18px; height: 18px;"></i>
                                <span data-i18n="nav_theme">Toggle Theme</span>
                            </a>
                            <a href="#" class="dropdown-item" onclick="window.handleLogout(); return false;" style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; color: var(--color-danger); text-decoration: none;">
                                <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
                                <span data-i18n="nav_logout">Logout</span>
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dynamic Views Container -->
            <div class="view-container" id="viewContainer">
                <!-- Views will be injected here by app.js -->
            </div>
        </main>
    </div>

    <!-- Supabase & JS & Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/db.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
