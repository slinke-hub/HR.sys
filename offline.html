<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1e3e62">
  <title>MUQAM HR — Offline</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: radial-gradient(circle at top, #1e3e62, #0b192c 65%); color: #fff; text-align: center; }
    main { width: min(100%, 420px); padding: 32px 24px; border: 1px solid rgba(255,255,255,.18); border-radius: 24px; background: rgba(11,25,44,.75); box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    img { width: min(220px, 75%); height: auto; margin-bottom: 24px; }
    h1 { margin: 0 0 10px; font-size: 1.6rem; }
    p { margin: 0 0 24px; color: rgba(255,255,255,.8); line-height: 1.55; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 14px; background: linear-gradient(135deg,#20c4e8,#8b78f6); color: #fff; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/images/logo.png" alt="MUQAM HR">
    <h1>You’re offline</h1>
    <p>Reconnect to the internet to load secure HR records and complete actions.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
